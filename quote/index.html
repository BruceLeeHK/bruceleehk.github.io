/* === Reset & Variables === */

<!-- Formspree AJAX 提交處理 -->
<script>
(function () {
  var form = document.getElementById('quote-form');
  if (!form) return;

  var submitBtn = document.getElementById('btn-submit');
  var successBox = document.getElementById('quote-success');
  var errorBox = document.getElementById('form-error');
  var replytoInput = document.getElementById('form-replyto');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    /* 清除舊的錯誤訊息 */
    errorBox.style.display = 'none';
    errorBox.textContent = '';

    /* 將電話欄位同時填入 _replyto（方便 Formspree 回覆） */
    if (replytoInput) {
      replytoInput.value = form.querySelector('#phone').value || '';
    }

    /* 按鈕狀態 */
    var originalText = submitBtn.textContent;
    submitBtn.textContent = '提交中...';
    submitBtn.disabled = true;

    /* 使用 Fetch API 提交到 Formspree */
    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    })
    .then(function (response) {
      if (response.ok) {
        /* 提交成功：隱藏表單，顯示成功訊息 */
        form.style.display = 'none';
        successBox.style.display = 'block';
      } else {
        /* 提交失敗：嘗試讀取 Formspree 回傳的錯誤 */
        return response.json().then(function (data) {
          var msgs = [];
          if (data.errors) {
            data.errors.forEach(function (err) { msgs.push(err.message); });
          }
          throw new Error(msgs.length ? msgs.join('、') : '提交失敗，請稍後再試。');
        });
      }
    })
    .catch(function (err) {
      /* 網絡錯誤或 Formspree 錯誤 */
      errorBox.textContent = err.message || '提交失敗，請檢查網絡連線後重試。';
      errorBox.style.display = 'block';
      submitBtn.textContent = originalText;
      submitBtn.disabled = false;
    });
  });
})();
</script>
