<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026年港人最厭惡嘅10大害蟲 — 全民票選 | 滅蟲專家</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #d32f2f;
      --primary-hover: #b71c1c;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-radius: 12px;
      --shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #fff;
      border-radius: var(--border-radius);
      margin-bottom: 25px;
      box-shadow: var(--shadow);
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ff5252;
    }

    header p {
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .intro-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
      margin-bottom: 25px;
      box-shadow: var(--shadow);
      border-left: 5px solid var(--primary-color);
    }

    /* 投票卡片列表 */
    .pest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      margin-bottom: 35px;
    }

    .pest-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .pest-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .pest-rank {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #f1f5f9;
      color: #475569;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .pest-info h3 {
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: #1e293b;
    }

    .pest-info p {
      font-size: 0.88rem;
      color: #64748b;
      margin-bottom: 15px;
    }

    .vote-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    .vote-count {
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
    }

    .btn-vote {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.88rem;
      transition: background-color 0.2s;
    }

    .btn-vote:hover {
      background-color: var(--primary-hover);
    }

    .btn-vote.voted {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* Cusdis 留言區塊 */
    .comment-container {
      background: var(--card-bg);
      padding: 25px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
    }

    .comment-container h2 {
      font-size: 1.3rem;
      color: #1e293b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .comment-container p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    footer a {
      color: var(--primary-color);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fas fa-bug"></i> 2026年港人最厭惡嘅10大害蟲</h1>
      <p>全民票選！選出你心中最難搞、最討厭嘅家居害蟲！</p>
    </header>

    <div class="intro-box">
      <p><strong>投票說明：</strong> 點擊下方害蟲卡片上的「投佢一票」即可完成投票。如果你有更慘痛嘅害蟲遭遇，歡迎喺頁面底部的「苦主經驗分享」區留言分享！</p>
    </div>

    <!-- 害蟲投票卡片列表 -->
    <div class="pest-grid" id="pestGrid"></div>

    <!-- Cusdis 留言區塊 -->
    <div class="comment-container">
      <h2><i class="fas fa-comments" style="color: var(--primary-color);"></i> 苦主經驗分享區</h2>
      <p class="subtitle">歡迎分享你嘅滅蟲經歷或發問，留言經 Email 審核後會公開顯示。</p>
      
      <div id="cusdis_thread"
        data-host="https://cusdis.com"
        data-app-id="0df347a4-18b9-46c5-a3c3-d8f752a69b63"
        data-page-id="vote-page-2026"
        data-page-url="https://bruceleehk.com/info/vote/"
        data-page-title="2026年港人最厭惡嘅10大害蟲 — 全民票選"
        data-theme="light">
      </div>
      <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
    </div>

    <footer>
      <p>© 2026 <a href="https://bruceleehk.com">bruceleehk.com</a> 滅蟲專家 | 版權所有</p>
    </footer>
  </div>

  <script>
    // 10大害蟲數據
    const pestsData = [
      { id: 'bedbug', name: '床虱 / 木虱', desc: '吸血咬人，引致劇癢難耐，最難根治。', defaultVotes: 1420 },
      { id: 'cockroach', name: '蟑螂 / 曱甴', desc: '繁殖力強，攜帶細菌，會飛嘅曱甴更係噩夢。', defaultVotes: 1280 },
      { id: 'termite', name: '白蟻', desc: '隱蔽性高，專咬木製傢俬同結構，破壞力極大。', defaultVotes: 980 },
      { id: 'rat', name: '老鼠', desc: '咬爛電線傳播病菌，深夜嘈吵影響作息。', defaultVotes: 850 },
      { id: 'mosquito', name: '蚊子', desc: '半夜喺耳邊嗡嗡叫，傳播登革熱等疾病。', defaultVotes: 730 },
      { id: 'midge', name: '蠓 (沙蚊)', desc: '體型極小，咬人成雙成對，咬完紅腫成星期。', defaultVotes: 610 },
      { id: 'ant', name: '黃蟻 / 偷盲蟻', desc: '成群結隊侵佔食物，甚至爬上床咬人。', defaultVotes: 520 },
      { id: 'mite', name: '塵蟎 / 粉蟎', desc: '引致皮膚過敏、鼻過敏，高濕度環境爆發。', defaultVotes: 440 },
      { id: 'flea', name: '跳蚤', desc: '寵物家庭宿敵，跳躍力強，專咬腳脛位置。', defaultVotes: 390 },
      { id: 'fly', name: '蚤蠅 / 蚊蠅', desc: '常喺廚廁垃圾桶同渠口滋生，滋擾性極高。', defaultVotes: 310 }
    ];

    function getVotedPests() {
      try { return JSON.parse(localStorage.getItem('voted_pests') || '[]'); } 
      catch(e) { return []; }
    }

    function getVoteCounts() {
      try { return JSON.parse(localStorage.getItem('pest_vote_counts') || '{}'); } 
      catch(e) { return {}; }
    }

    function renderPestGrid() {
      const grid = document.getElementById('pestGrid');
      const votedList = getVotedPests();
      const storedCounts = getVoteCounts();

      grid.innerHTML = '';

      pestsData.forEach((pest, index) => {
        const isVoted = votedList.includes(pest.id);
        const currentVotes = (storedCounts[pest.id] !== undefined) ? storedCounts[pest.id] : pest.defaultVotes;

        const card = document.createElement('div');
        card.className = 'pest-card';
        card.innerHTML = `
          <span class="pest-rank">NO. ${index + 1}</span>
          <div class="pest-info">
            <h3>${pest.name}</h3>
            <p>${pest.desc}</p>
          </div>
          <div class="vote-action">
            <span class="vote-count" id="count-${pest.id}">${currentVotes} 票</span>
            <button class="btn-vote ${isVoted ? 'voted' : ''}" 
                    onclick="handleVote('${pest.id}')" 
                    ${isVoted ? 'disabled' : ''}>
              ${isVoted ? '已投票' : '投佢一票'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleVote(pestId) {
      let votedList = getVotedPests();
      if (votedList.includes(pestId)) return;

      votedList.push(pestId);
      localStorage.setItem('voted_pests', JSON.stringify(votedList));

      let storedCounts = getVoteCounts();
      const targetPest = pestsData.find(p => p.id === pestId);
      const baseCount = (storedCounts[pestId] !== undefined) ? storedCounts[pestId] : targetPest.defaultVotes;
      storedCounts[pestId] = baseCount + 1;
      localStorage.setItem('pest_vote_counts', JSON.stringify(storedCounts));

      renderPestGrid();
    }

    document.addEventListener('DOMContentLoaded', renderPestGrid);
  </script>
</body>
</html>
